<!DOCTYPE html>

	<head>

					<img class="scene-bg" src="../img/scene/yulin-guide-light-green-v3.png" alt="AI主题导览插画：青山湖面、楼阁、米粉摊、民俗戏台与竹编摊、木制取景框" />
				</picture>
				<p class="scene-note">AI主题导览插画 · 不代表精确地理位置</p>

				<a href="detail.html#sport" class="sport" aria-label="山水漫游">
					<img src="../img/icons/nature.svg" alt="山水的图标">
					<span class="entry-label">山水漫游</span>
				</a>
				<a href="detail.html#reading" class="reading" aria-label="人文寻踪">
					<img src="../img/icons/culture.svg" alt="楼阁的图标">
					<span class="entry-label">人文寻踪</span>
				</a>
				<a href="detail.html#music" class="music" aria-label="寻味玉林">

				</a>
				<a href="detail.html#folk" class="folk" aria-label="民俗拾趣">
					<img src="../img/icons/folk.svg" alt="民俗戏台的图标">
					<span class="entry-label">民俗拾趣</span>
				</a>
				<a href="detail.html#photo" class="photo" aria-label="光影玉林">
					<img src="../img/icons/light.svg" alt="相机的图标">
					<span class="entry-label">光影玉林</span>
				</a>
			</div>

			<!-- 介绍：电脑端覆盖在场景上方，手机端排在场景之前 -->
			<div class="my-content">
				<div class="my-information">
