      <circle cx="-32" cy="-124" r="34" fill="#7fae72" opacity="0.95"/>
      <circle cx="18" cy="-138" r="42" fill="#8fbc7f" opacity="0.95"/>
      <circle cx="46" cy="-102" r="30" fill="#76a56c" opacity="0.95"/>
      <circle cx="-8" cy="-92" r="36" fill="#86b478" opacity="0.95"/>
