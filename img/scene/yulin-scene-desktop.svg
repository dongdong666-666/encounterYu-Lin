      <stop offset="1" stop-color="#c9903d"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e7ac"/>
      <stop offset="1" stop-color="#bfd98f"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7df9e"/>
      <stop offset="1" stop-color="#a9cb82"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#f7dda3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f7dda3" stop-opacity="0"/>
