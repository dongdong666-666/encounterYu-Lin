<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="玉林手绘漫游示意图：青山云海、田园荷塘、真武阁、米粉摊、民俗戏台与竹编摊、照片取景框">
