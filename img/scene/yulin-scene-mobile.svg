    <path d="M26,146 Q58,138 90,148 Q118,156 144,144 L144,170 L26,170 Z" fill="#bcddd4"/>
    <circle cx="118" cy="58" r="11" fill="#f5d492"/>
    <path d="M48,48 Q58,40 68,48 M74,38 Q84,30 94,38" stroke="#fffdf5" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <use href="#tree" transform="translate(620,640) scale(1.1)"/>
  <use href="#tree" transform="translate(70,620) scale(0.9)"/>
  <use href="#tree" transform="translate(700,1260) scale(1.15)"/>
  <use href="#tree" transform="translate(60,1000) scale(0.8)"/>

  <g fill="#f2f7e8" opacity="0.85">
    <circle cx="220" cy="1420" r="5"/><circle cx="246" cy="1434" r="4"/><circle cx="196" cy="1442" r="3"/>
    <circle cx="500" cy="1410" r="4"/><circle cx="526" cy="1424" r="5"/><circle cx="552" cy="1412" r="3"/>
    <circle cx="680" cy="1440" r="4"/><circle cx="706" cy="1452" r="5"/>
  </g>
  <g fill="#d98a6a" opacity="0.75">
    <circle cx="300" cy="1448" r="4"/><circle cx="340" cy="1436" r="3"/><circle cx="380" cy="1450" r="4"/>
    <circle cx="600" cy="1444" r="4"/><circle cx="640" cy="1456" r="3"/>
  </g>
  <use href="#bird" transform="translate(560,240) scale(0.7)"/>
  <use href="#bird" transform="translate(640,200) scale(0.55)"/>

  <rect width="780" height="1500" fill="url(#paperDots)" opacity="0.55"/>
  <rect x="2" y="2" width="776" height="1496" fill="none" stroke="#b9a77f" stroke-width="2" opacity="0.35"/>
</svg>
