  <path d="M390,620 L390,648 M590,620 L590,648" stroke="#a98252" stroke-width="4"/>
  <path d="M410,600 L410,648 M570,600 L570,648" stroke="#9d5b44" stroke-width="5"/>
  <path d="M352,520 Q430,486 490,520 L490,542 L352,542 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M628,520 Q550,486 490,520 L490,542 L628,542 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M336,520 Q320,510 306,490 M644,520 Q660,510 674,490" stroke="#7f3a31" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M410,470 Q470,444 530,470 L530,492 L410,492 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M610,470 Q550,444 490,470 L490,492 L610,492 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M394,470 Q378,460 366,440 M626,470 Q642,460 654,440" stroke="#7f3a31" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M432,492 L548,492 L548,520 L432,520 Z" fill="#f6eed8" stroke="#a98252" stroke-width="2"/>
  <path d="M472,492 L508,492 L508,520 L472,520 Z" fill="#9d5b44"/>
  <path d="M444,504 L462,504 L462,516 L444,516 Z M518,504 L536,504 L536,516 L518,516 Z" fill="#e7d3ad" stroke="#a98252" stroke-width="1.5"/>
  <path d="M440,410 Q470,388 500,410 L500,432 L440,432 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M556,410 Q526,388 496,410 L496,432 L556,432 Z" fill="url(#roof)" stroke="#7f3a31" stroke-width="2"/>
  <path d="M424,410 Q410,400 400,382 M572,410 Q586,400 596,382" stroke="#7f3a31" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M452,432 L508,432 L508,470 L452,470 Z" fill="#f6eed8" stroke="#a98252" stroke-width="2"/>
  <path d="M468,432 L492,432 L492,470 L468,470 Z" fill="#9d5b44"/>
  <path d="M420,542 L560,542 L560,600 L420,600 Z" fill="#f6eed8" stroke="#a98252" stroke-width="3"/>
  <path d="M436,552 L462,552 L462,584 L436,584 Z M518,552 L544,552 L544,584 L518,584 Z" fill="#e7d3ad" stroke="#a98252" stroke-width="2"/>
  <path d="M474,552 L506,552 L506,584 L474,584 Z" fill="#9d5b44"/>
  <path d="M430,600 L550,600 M450,600 L450,620 M530,600 L530,620" stroke="#a98252" stroke-width="3"/>
  <circle cx="410" cy="560" r="6" fill="#e3b45c"/>
  <circle cx="570" cy="560" r="6" fill="#e3b45c"/>

  <!-- 左侧田园与荷塘 -->
  <path d="M0,680 Q110,650 240,670 Q330,684 360,676 L360,940 L0,940 Z" fill="url(#field)"/>
  <path d="M0,720 Q110,696 230,716 Q310,728 360,718" stroke="#a9c77e" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M0,770 Q110,746 230,766 Q310,778 360,768" stroke="#9dbc75" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M0,820 Q90,800 180,816 Q260,830 340,818 L340,900 Q250,914 170,898 Q80,882 0,900 Z" fill="url(#water)" opacity="0.95"/>
  <g stroke="#e8f4ee" stroke-width="2" fill="none" opacity="0.65">
    <path d="M30,846 Q85,838 140,848"/>
    <path d="M170,872 Q225,864 280,874"/>
    <path d="M60,888 Q115,880 170,890"/>
  </g>
  <use href="#lotusPad" transform="translate(70,852) scale(0.9)"/>
  <use href="#lotusPad" transform="translate(150,884) scale(0.75)"/>
  <use href="#lotus" transform="translate(100,834) scale(0.8)"/>
  <use href="#lotus" transform="translate(190,868) scale(0.6)"/>

  <!-- 小路 -->
  <path d="M390,1500 C300,1380 520,1280 430,1160 C340,1040 520,960 450,860 C380,760 300,700 340,620 C380,540 520,500 430,420 C380,380 330,340 330,300" stroke="#ead8b4" stroke-width="48" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M390,1500 C300,1380 520,1280 430,1160 C340,1040 520,960 450,860 C380,760 300,700 340,620 C380,540 520,500 430,420 C380,380 330,340 330,300" stroke="#d8c29a" stroke-width="2" fill="none" stroke-dasharray="9 16" opacity="0.65"/>

  <!-- 米粉摊 -->
  <g transform="translate(75,700)">
    <path d="M10,120 L190,120 L200,150 L0,150 Z" fill="#e9d8b6" stroke="#a98252" stroke-width="3"/>
    <path d="M-10,118 L210,118 L194,78 L6,78 Z" fill="#f7e7bd" stroke="#a98252" stroke-width="3"/>
    <path d="M-10,118 L210,118 L194,78 L6,78 Z" fill="none" stroke="#d98a6a" stroke-width="4" stroke-dasharray="18 14" opacity="0.7"/>
    <path d="M10,118 L10,150 M190,118 L190,150" stroke="#8a6a4d" stroke-width="5"/>
    <path d="M28,118 L28,70 M172,118 L172,70" stroke="#8a6a4d" stroke-width="4"/>
    <ellipse cx="100" cy="112" rx="30" ry="10" fill="#6f5a42" opacity="0.25"/>
    <path d="M80,92 Q100,114 120,92 Z" fill="#f8f3e5" stroke="#a98252" stroke-width="2"/>
    <path d="M88,86 Q100,92 112,86" stroke="#a98252" stroke-width="2" fill="none"/>
    <use href="#bowl" transform="translate(58,100) scale(0.62)"/>
    <use href="#bowl" transform="translate(142,100) scale(0.62)"/>
    <path d="M104,78 C94,60 116,52 106,34 C98,20 112,12 108,-2" stroke="#fffdf5" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
    <g transform="translate(208,120) scale(0.8)">
      <path d="M0,0 L40,0 L40,42 L0,42 Z" fill="#d8b37a" stroke="#8a6a4d" stroke-width="2"/>
      <path d="M6,10 L34,10 M6,20 L34,20 M6,30 L34,30" stroke="#a98252" stroke-width="1.5"/>
      <path d="M4,-6 L36,-6" stroke="#8a6a4d" stroke-width="4"/>
    </g>
    <g transform="translate(40,164) scale(0.8)">
      <ellipse cx="24" cy="12" rx="26" ry="8" fill="#d8b37a" stroke="#8a6a4d" stroke-width="2"/>
      <path d="M0,12 L0,34 M48,12 L48,34 M0,34 L48,34" stroke="#8a6a4d" stroke-width="4"/>
    </g>
  </g>

  <!-- 民俗戏台与竹编摊 -->
  <g transform="translate(390,880)">
    <path d="M0,190 L300,190 L318,212 L-18,212 Z" fill="#e9d8b6" stroke="#a98252" stroke-width="3"/>
    <path d="M20,190 L20,150 L280,150 L280,190 Z" fill="#f3e3c4" stroke="#a98252" stroke-width="3"/>
    <path d="M28,150 L28,76 L272,76 L272,150 Z" fill="#f8efdc" stroke="#a98252" stroke-width="3"/>
    <path d="M28,76 L272,76 L252,46 L48,46 Z" fill="url(#gold)" stroke="#9a6b2f" stroke-width="3"/>
    <path d="M48,46 Q30,36 18,18 M252,46 Q270,36 282,18" stroke="#9a6b2f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M92,76 L92,150 Q116,166 140,150 L140,76" fill="#b9564a" opacity="0.9"/>
    <path d="M160,76 L160,150 Q184,166 208,150 L208,76" fill="#b9564a" opacity="0.9"/>
    <path d="M92,76 Q116,86 140,76 M160,76 Q184,86 208,76" stroke="#8f3d35" stroke-width="3" fill="none"/>
    <circle cx="150" cy="118" r="22" fill="#f1dfb4" stroke="#8a6a4d" stroke-width="2"/>
    <path d="M128,118 L172,118 M150,96 L150,140" stroke="#8a6a4d" stroke-width="2"/>
    <path d="M38,76 L38,150 M262,76 L262,150" stroke="#9d5b44" stroke-width="5"/>
    <circle cx="46" cy="60" r="9" fill="#d98a6a" stroke="#a85a4a" stroke-width="2"/>
    <circle cx="254" cy="60" r="9" fill="#d98a6a" stroke="#a85a4a" stroke-width="2"/>
    <path d="M42,46 L42,62 M258,46 L258,62" stroke="#a85a4a" stroke-width="2"/>
    <g transform="translate(292,72)">
      <path d="M0,0 L0,-80 M14,-80 L14,-20 M28,-80 L28,-40 M42,-80 L42,-10 M56,-80 L56,-36" stroke="#7fae76" stroke-width="4" opacity="0.8"/>
      <use href="#basket" transform="translate(24,64) scale(0.8)"/>
      <use href="#basket" transform="translate(58,74) scale(0.55)"/>
    </g>
  </g>

  <!-- 照片取景框 -->
  <g transform="translate(125,1080)">
    <path d="M28,200 L8,292 M142,200 L162,292 M85,200 L85,298" stroke="#8a6a4d" stroke-width="6" stroke-linecap="round"/>
    <path d="M6,178 L164,178 L164,202 L6,202 Z" fill="#c99a6a" stroke="#8a6a4d" stroke-width="3"/>
