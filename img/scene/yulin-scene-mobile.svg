<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1500" viewBox="0 0 780 1500" role="img" aria-label="玉林手绘漫游示意图手机版：沿小路从青山云海走到真武阁、米粉摊、民俗戏台和照片取景框">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e4"/>
      <stop offset="0.55" stop-color="#eef2da"/>
      <stop offset="1" stop-color="#dfeacd"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5dab8"/>
      <stop offset="1" stop-color="#a9c79c"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cb98"/>
      <stop offset="1" stop-color="#8bb47f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e2d8"/>
      <stop offset="1" stop-color="#a9d0c5"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8614f"/>
      <stop offset="1" stop-color="#93453a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b45c"/>
      <stop offset="1" stop-color="#c9903d"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e7ac"/>
      <stop offset="1" stop-color="#b9d48a"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#f7dda3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f7dda3" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <path d="M0,0 Q18,-26 48,-18 Q66,-40 96,-22 Q124,-30 138,-6 Q160,-2 158,18 Q156,34 132,36 L18,36 Q-6,34 -6,18 Q-6,4 0,0 Z" fill="#fffdf3"/>
    </g>
    <g id="tree">
      <path d="M0,0 C-8,-38 -10,-72 -2,-108" stroke="#8a6a4d" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M-2,-70 C-24,-84 -38,-96 -44,-112 M-4,-86 C14,-98 28,-108 34,-124" stroke="#8a6a4d" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="-32" cy="-124" r="34" fill="#7fae72" opacity="0.95"/>
      <circle cx="18" cy="-138" r="42" fill="#8fbc7f" opacity="0.95"/>
      <circle cx="46" cy="-102" r="30" fill="#76a56c" opacity="0.95"/>
      <circle cx="-8" cy="-92" r="36" fill="#86b478" opacity="0.95"/>
      <circle cx="-52" cy="-92" r="24" fill="#79a96e" opacity="0.95"/>
    </g>
    <g id="lotusPad">
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="#8bbf8a" opacity="0.9"/>
      <path d="M-22,0 Q0,-7 22,0" stroke="#6f9f6e" stroke-width="1.5" fill="none"/>
    </g>
    <g id="lotus">
      <path d="M0,0 C-7,-9 -7,-18 0,-24 C7,-18 7,-9 0,0 Z" fill="#f2b7c3"/>
      <path d="M0,0 C-12,-4 -17,-11 -15,-18 C-7,-14 -2,-8 0,0 Z" fill="#efa8b7"/>
      <path d="M0,0 C12,-4 17,-11 15,-18 C7,-14 2,-8 0,0 Z" fill="#efa8b7"/>
      <circle cx="0" cy="-3" r="3" fill="#f6d28a"/>
    </g>
    <g id="basket">
      <path d="M-32,0 L32,0 L24,34 L-24,34 Z" fill="#d8b37a" stroke="#8a6a4d" stroke-width="2"/>
      <path d="M-28,8 L28,8 M-26,16 L26,16 M-25,24 L25,24" stroke="#a98252" stroke-width="1.5"/>
      <path d="M-20,-26 Q0,-42 20,-26" stroke="#a98252" stroke-width="3" fill="none"/>
    </g>
    <g id="bowl">
      <path d="M-24,0 Q0,26 24,0 Z" fill="#f7f2e5" stroke="#a98252" stroke-width="2"/>
      <path d="M-16,-6 Q0,-12 16,-6" stroke="#a98252" stroke-width="2" fill="none"/>
    </g>
    <g id="bird">
      <path d="M0,0 Q8,-8 16,0 M16,0 Q24,-8 32,0" stroke="#7a8a6a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <pattern id="paperDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.8" fill="#8a7a58" opacity="0.13"/>
      <circle cx="17" cy="18" r="0.7" fill="#8a7a58" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="780" height="1500" fill="url(#sky)"/>
  <circle cx="130" cy="120" r="100" fill="url(#sunGlow)"/>
  <circle cx="130" cy="120" r="38" fill="#f5d492" opacity="0.85"/>
  <circle cx="130" cy="120" r="50" fill="none" stroke="#e8c37d" stroke-width="2" opacity="0.45"/>
  <g opacity="0.85">
    <use href="#cloud" transform="translate(250,120) scale(0.86)"/>
    <use href="#cloud" transform="translate(500,170) scale(0.7)"/>
    <use href="#cloud" transform="translate(80,230) scale(0.55)"/>
  </g>

  <!-- 青山云海 -->
  <path d="M0,390 L80,300 L150,340 L230,260 L300,330 L380,280 L460,350 L540,290 L640,360 L720,300 L780,350 L780,470 L0,470 Z" fill="url(#farHill)"/>
  <path d="M0,430 L100,360 L200,410 L290,350 L390,420 L480,370 L580,430 L680,380 L780,430 L780,520 L0,520 Z" fill="url(#midHill)"/>
  <g fill="#fffdf5" opacity="0.7">
    <path d="M0,400 Q90,382 170,400 Q260,420 340,400 Q420,380 500,398 L500,428 Q420,410 340,430 Q250,450 170,430 Q80,410 0,428 Z"/>
    <path d="M460,410 Q540,392 620,408 Q700,424 780,406 L780,436 Q700,454 620,438 Q540,422 460,440 Z"/>
  </g>

